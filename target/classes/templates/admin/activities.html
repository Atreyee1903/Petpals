<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head><title>Activities - Admin</title></head>
<body>
<div layout:fragment="content">
    <h4 class="pp-section-title mb-4">Activity Logs</h4>
    <div class="card pp-card">
        <div class="table-responsive">
            <table class="table table-hover mb-0">
                <thead class="table-light">
                    <tr>
                        <th>User</th>
                        <th>Action</th>
                        <th>Description</th>
                        <th>Date/Time</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="activity : ${activities.content}">
                        <td th:text="${activity.userName}">User</td>
                        <td th:text="${activity.action}">Action</td>
                        <td th:text="${activity.description}">Description</td>
                        <td th:text="${#temporals.format(activity.timestamp, 'dd/MM/yyyy HH:mm')}">Date</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
