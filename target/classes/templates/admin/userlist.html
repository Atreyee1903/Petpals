<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>User List - Admin</title>
</head>
<body>
<div layout:fragment="content">
    <h4 class="pp-section-title mb-4"><i class="bi bi-people me-2"></i>User Management</h4>
    
    <div class="card pp-card mb-4">
        <div class="card-body">
            <form method="get" class="d-flex gap-2">
                <input type="text" name="search" class="form-control" placeholder="Search by name, email, or username"
                       th:value="${searchTerm}">
                <button type="submit" class="btn btn-primary">Search</button>
                <a href="/admin/users" class="btn btn-outline-secondary">Clear</a>
            </form>
        </div>
    </div>

    <div class="card pp-card">
        <div class="table-responsive">
            <table class="table table-hover mb-0">
                <thead class="table-light">
                    <tr>
                        <th>Username</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Status</th>
                        <th>Orders</th>
                        <th>Spent</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="user : ${users.content}">
                        <td><strong th:text="${user.username}">user</strong></td>
                        <td th:text="${user.fullName}">Name</td>
                        <td th:text="${user.email}">email</td>
                        <td>
                            <th:block th:if="${user.blocked}">
                                <span class="badge bg-danger">Blocked</span>
                            </th:block>
                            <th:block th:if="${!user.blocked && user.admin}">
                                <span class="badge bg-primary">Admin</span>
                            </th:block>
                            <th:block th:if="${!user.blocked && !user.admin}">
                                <span class="badge bg-success">Active</span>
                            </th:block>
                        </td>
                        <td th:text="${user.ordersCount}">0</td>
                        <td th:text="${user.totalSpent}">0</td>
                        <td>
                            <a th:href="@{/admin/users/{id}(id=${user.id})}" class="btn btn-sm btn-info">View</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
