<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head><title>Blocked Users - Admin</title></head>
<body>
<div layout:fragment="content">
    <h4 class="pp-section-title mb-4">Blocked Users</h4>
    <div class="card pp-card">
        <div class="table-responsive">
            <table class="table table-hover mb-0">
                <thead class="table-light">
                    <tr>
                        <th>Username</th>
                        <th>Full Name</th>
                        <th>Email</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="user : ${blockedUsers.content}">
                        <td th:text="${user.username}">User</td>
                        <td th:text="${user.fullName}">Name</td>
                        <td th:text="${user.email}">Email</td>
                        <td><span class="badge bg-danger">Blocked</span></td>
                        <td>
                            <a th:href="@{/admin/users/{id}(id=${user.id})}" class="btn btn-sm btn-info">View</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
